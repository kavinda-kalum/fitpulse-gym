<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitPulse — Gym workouts, calories &amp; body measurements in one place</title>
  <meta name="description" content="FitPulse is a fitness tracker that brings your workouts, calories burned, nutrition and body measurements together in one place.">
  <meta name="theme-color" content="#E5383B">
  <meta property="og:title" content="FitPulse — Fitness tracker">
  <meta property="og:description" content="Workouts, calories and body measurements in one place.">
  <meta property="og:image" content="assets/img/showcase-mobile.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved / system theme before paint to avoid a flash
    (function () {
      try {
        var t = localStorage.getItem('fp-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>
  <div class="glow glow--red" aria-hidden="true"></div>
  <div class="glow glow--gray" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar glass" aria-label="Main navigation">
      <div class="sidebar__top">
        <a class="logo" href="#/" aria-label="FitPulse home">
          <span class="logo__mark"><svg class="ic"><use href="#i-zap"/></svg></span>
          <span class="logo__text">FitPulse</span>
        </a>
        <p class="sidebar__label">Menu</p>
        <nav class="nav" id="side-nav"></nav>
      </div>
      <div class="goal-card">
        <div class="goal-card__ring" id="goal-ring"></div>
        <p class="goal-card__title">Weekly goal</p>
        <p class="goal-card__text" id="goal-text">2 more workouts to hit your target this week.</p>
        <a class="btn btn--primary btn--sm btn--block" href="#/workouts">Plan workout</a>
        <button class="link-btn" data-action="reset-data" type="button"><svg class="ic"><use href="#i-reset"/></svg>Reset demo data</button>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar glass" id="tab-nav" aria-label="Main navigation"></nav>

  <div class="onboarding" id="onboarding" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
